<meta name="theme-color" content="#10152a" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<body>
<title>A Day With Jesus</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231b2440%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2242%22%20r%3D%2215%22%20fill%3D%22%23e5a94c%22/%3E%3Crect%20x%3D%220%22%20y%3D%2242%22%20width%3D%2264%22%20height%3D%2222%22%20fill%3D%22%231b2440%22/%3E%3Crect%20x%3D%229%22%20y%3D%2240.5%22%20width%3D%2246%22%20height%3D%223.5%22%20rx%3D%221.75%22%20fill%3D%22%23f1f3f7%22/%3E%3Crect%20x%3D%2230.25%22%20y%3D%2210%22%20width%3D%223.5%22%20height%3D%2230%22%20rx%3D%221.75%22%20fill%3D%22%23f1f3f7%22/%3E%3Crect%20x%3D%2223%22%20y%3D%2217%22%20width%3D%2218%22%20height%3D%223.5%22%20rx%3D%221.75%22%20fill%3D%22%23f1f3f7%22/%3E%3C/svg%3E">
<style>
/* Layout: phone-first app shell. Sticky title bar, one scrolling content column, tab bar fixed to the bottom on phones and inline under the title on wide screens. */
:root {
  --bg: #f1f3f7;
  --paper: #ffffff;
  --ink: #1b2440;
  --muted: #5b6580;
  --line: #dde2ec;
  --accent: #b5761c;       /* sunrise gold */
  --accent-soft: #f7ecd8;
  --indigo: #33437a;
  --indigo-soft: #e6eaf6;
  --ok: #2f7a4f;
  --ok-soft: #e1f1e7;
  --danger: #a8372f;
  --hl: rgba(229, 172, 66, .28);
  --read: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --read-size: 18px;
  --sky-top: #f6e6c8; --sky-bot: #fbf3e6; --hill-far: #a9b3c9; --hill-near: #7d8aa8;
  --bridge-sky: #eef1f8; --bridge-cliff: #c9d1e3; --bridge-chasm: #2a3352; --bridge-chasm-text: #f1c27a; --bridge-cross: #8a5a22; --bridge-label: #1b2440;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10152a; --paper: #182039; --ink: #e7eaf3; --muted: #9aa4bd; --line: #2a3352;
    --accent: #e4a94c; --accent-soft: #33291a; --indigo: #aab8ea; --indigo-soft: #222c4c;
    --ok: #6cc796; --ok-soft: #173326; --danger: #ef8077; --hl: rgba(228, 169, 76, .25); --sky-top: #2a2f4d; --sky-bot: #1a2038; --hill-far: #39436a; --hill-near: #2b3456; --bridge-sky: #1b2240; --bridge-cliff: #34406a; --bridge-chasm: #0b0f1f; --bridge-chasm-text: #e4a94c; --bridge-cross: #d39a52; --bridge-label: #e7eaf3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10152a; --paper: #182039; --ink: #e7eaf3; --muted: #9aa4bd; --line: #2a3352;
  --accent: #e4a94c; --accent-soft: #33291a; --indigo: #aab8ea; --indigo-soft: #222c4c;
  --ok: #6cc796; --ok-soft: #173326; --danger: #ef8077; --hl: rgba(228, 169, 76, .25); --sky-top: #2a2f4d; --sky-bot: #1a2038; --hill-far: #39436a; --hill-near: #2b3456; --bridge-sky: #1b2240; --bridge-cliff: #34406a; --bridge-chasm: #0b0f1f; --bridge-chasm-text: #e4a94c; --bridge-cross: #d39a52; --bridge-label: #e7eaf3; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--indigo); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell { max-width: 860px; margin: 0 auto; }

/* Title bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .shell { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--read); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* Tab bar: bottom bar with "More" on phones, scrolling tab row on tablets and desktops */
.tabbar { display: flex; gap: 4px; }
.tabbar button { flex: 1; display: grid; justify-items: center; gap: 2px; border: 0; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 8px 4px; border-radius: 12px; cursor: pointer; min-width: 0; white-space: nowrap; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] svg { color: var(--accent); }
.tabbar button span:last-child { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (max-width: 699px) {
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); border-top: 1px solid var(--line);
    padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); gap: 0; }
  .tabbar .secondary-tab { display: none; }
  .tabbar button { min-height: 54px; font-size: 11px; }
  main { padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)) !important; }
  .selbar, .toast { bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)) !important; }
  .topbar .shell { padding-block: 8px; }
  .brand h1 { font-size: 18px; }
}
@media (min-width: 700px) {
  .tabbar-wrap { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 19; }
  .tabbar { padding-block: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabbar::-webkit-scrollbar { display: none; }
  .tabbar .more-tab { display: none; }
  .tabbar button { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; gap: 7px; font-size: 14px; padding: 9px 13px; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button[aria-current="page"] { background: var(--paper); box-shadow: 0 0 0 1px var(--line); }
}
@media (min-width: 1100px) { .tabbar { justify-content: center; } }
.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.more-item { display: grid; justify-items: center; gap: 8px; padding: 18px 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink); text-align: center; }
.more-item svg { width: 28px; height: 28px; color: var(--accent); }
.more-item.cur { border-color: var(--accent); background: var(--accent-soft); }

main { padding-block: 22px 56px; }
[hidden] { display: none !important; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
h2.title { font-family: var(--read); font-weight: 600; font-size: clamp(24px, 4.5vw, 32px); line-height: 1.15; margin: 4px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
h3.sub { margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; border-radius: 11px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; line-height: 1.2; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.soft { background: var(--indigo-soft); border-color: transparent; color: var(--indigo); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--indigo-soft); color: var(--indigo); }
.chip.gold { background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
input.field, textarea.field, select.field { font-size: 16px; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
textarea.field { font-family: var(--read); font-size: 16px; line-height: 1.65; resize: vertical; }
label.lbl { display: grid; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
label.lbl > * { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); font-size: 15px; }

/* Today */
.dayhead { display: grid; gap: 6px; }
.daynav { display: flex; align-items: center; gap: 6px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-size: 15px; }
.chap { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.chap:first-of-type { border-top: 0; }
.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; cursor: pointer; padding: 0; }
.check svg { width: 16px; height: 16px; opacity: 0; color: var(--paper); }
.check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"] svg { opacity: 1; }
.chap .name { font-family: var(--read); font-size: 17px; font-weight: 600; }
.chap .lane { font-size: 12px; color: var(--muted); }
.verse-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 10px; }
.verse-card blockquote { margin: 0; font-family: var(--read); font-size: 18px; line-height: 1.6; font-style: italic; }
.verse-card .ref { font-weight: 800; font-size: 13px; letter-spacing: .05em; color: var(--indigo); }
.soap { display: grid; gap: 12px; }
.soap textarea { min-height: 84px; }
.saved-note { font-size: 12.5px; color: var(--muted); min-height: 1em; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--indigo-soft); color: var(--indigo); border-radius: 14px; padding: 12px 14px; font-size: 14px; }

/* Plan list */
.plan-list { display: grid; gap: 6px; }
.plan-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; }
.plan-row.current { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.plan-row .dn { font-weight: 800; font-variant-numeric: tabular-nums; }
.plan-row .dd { font-size: 12px; color: var(--muted); }
.plan-row .refs { font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-month { margin: 14px 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Bible */
.bible-bar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.bible-bar select { min-width: 0; }
.chapter-title { font-family: var(--read); font-size: 28px; font-weight: 600; margin: 0; }
.verses { font-family: var(--read); font-size: var(--read-size); line-height: 1.8; }
.verses p { margin: 0; padding: 3px 6px; border-radius: 8px; cursor: pointer; }
.verses p sup { font-family: var(--ui); font-size: .6em; font-weight: 700; color: var(--accent); margin-right: 6px; vertical-align: .45em; }
.verses p.sel { background: var(--indigo-soft); }
.verses p.saved { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.verses p.hl { background: var(--hl); }
.sc { font-variant: small-caps; letter-spacing: .03em; }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 26; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; background: var(--ink); color: var(--paper); padding: 8px; border-radius: 16px; box-shadow: 0 10px 30px rgba(10, 15, 35, .3); width: max-content; max-width: calc(100% - 24px); }
.selbar .btn { background: transparent; border-color: transparent; color: var(--paper); }
.selbar .count { align-self: center; font-size: 13px; font-weight: 700; padding: 0 8px; }
.search-results { display: grid; gap: 6px; }
.result { text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); cursor: pointer; width: 100%; }
.result b { display: block; font-size: 12.5px; color: var(--indigo); margin-bottom: 2px; }
.result span { font-family: var(--read); font-size: 15.5px; }
.result mark { background: var(--hl); color: inherit; border-radius: 3px; }
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.book-grid button, .chap-grid button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 8px; cursor: pointer; font-size: 13.5px; font-weight: 600; text-align: left; }
.chap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.chap-grid button { text-align: center; font-variant-numeric: tabular-nums; }
.book-grid button.cur, .chap-grid button.cur { border-color: var(--accent); background: var(--accent-soft); }

/* Memory + saved cards */
.mem-list { display: grid; gap: 10px; }
.mem { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; min-width: 0; }
.mem.week { border-color: var(--accent); }
.mem .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; flex-wrap: wrap; }
.mem .ref { font-weight: 800; color: var(--indigo); font-size: 14px; }
.mem .topic { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.mem .txt { font-family: var(--read); font-size: 16.5px; line-height: 1.6; margin: 0; }
.mem .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
.sec-head b { font-family: var(--read); font-size: 20px; }
.btn.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* Notes */
.journal { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
@media (max-width: 759px) { .journal { grid-template-columns: 1fr; } .journal.editing .note-list { display: none; } .journal:not(.editing) .editor-col { display: none; } }
.note-list { display: grid; gap: 8px; min-width: 0; }
.note-item { text-align: left; display: grid; gap: 3px; padding: 12px 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); width: 100%; min-width: 0; cursor: pointer; }
.note-item.active { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.note-item .nt { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item .nm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 6px; flex-wrap: wrap; }
.note-item .ns { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.editor { display: grid; gap: 12px; }
.editor textarea.body { min-height: 240px; }
.attach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.att { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); display: grid; min-width: 0; }
.att img { width: 100%; height: 120px; object-fit: cover; display: block; background: var(--line); }
.att audio, .att video { width: 100%; display: block; }
.att .meta { padding: 8px 10px; display: grid; gap: 4px; font-size: 12.5px; min-width: 0; }
.att .meta .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .doc { height: 72px; display: grid; place-items: center; color: var(--indigo); font-weight: 800; font-size: 13px; letter-spacing: .06em; background: var(--indigo-soft); }
.att.wide { grid-column: 1 / -1; }
.dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; color: var(--muted); font-size: 13.5px; }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }

.empty { text-align: center; padding: 32px 18px; color: var(--muted); background: var(--paper); border: 1px dashed var(--line); border-radius: 16px; display: grid; gap: 10px; justify-items: center; }
.empty b { font-family: var(--read); font-size: 18px; color: var(--ink); }
.confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* Overlay (practice, settings) */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 12, 28, .55); display: grid; place-items: end center; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
@media (min-width: 760px) { .overlay { place-items: center; } }
.sheet { background: var(--paper); color: var(--ink); width: 100%; max-width: 560px; max-height: 100%; overflow: auto; border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
.flash { display: grid; gap: 14px; text-align: center; }
.flash .ref { font-family: var(--read); font-size: 26px; font-weight: 600; }
.flash .txt { font-family: var(--read); font-size: 19px; line-height: 1.65; min-height: 120px; display: grid; place-items: center; padding: 16px; border-radius: 14px; background: var(--bg); }
.flash .txt.hidden { color: var(--muted); font-style: italic; font-size: 15px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(10, 15, 35, .3); max-width: calc(100% - 32px); }
.loading { display: grid; place-items: center; gap: 10px; padding: 40px 0; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .3s ease both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

/* Inputs: 16px stops iPhone from zooming in on focus */
input, select, textarea { font-size: 16px; }
.seg-wide { display: flex; width: 100%; }
.seg-wide button { flex: 1; }
.seg button { min-height: 36px; }

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */

    if (dbp) return dbp;

      try {

function buildPlan() {

function findBook(name) {
  const n = name.trim().toLowerCase().replace(/\s+/g, " ").replace(/^psalm$/, "psalms").replace(/^song of songs$/, "song of solomon");
  let i = BOOKS.findIndex(b => b.toLowerCase() === n);
  if (i < 0) i = BOOKS.findIndex(b => b.toLowerCase().replace(/\s/g, "") === n.replace(/\s/g, ""));
  return i;
}
function parseRef(ref) {
  const m = /^\s*((?:[123]\s*)?[A-Za-z][A-Za-z ]*?)\s*(\d+)(?::([\d\s,\-–]+))?\s*$/.exec(ref || "");
  if (!m) return null;
  const b = findBook(m[1]); if (b < 0) return null;
  const c = +m[2]; if (c < 1 || c > CHAPTERS[b]) return null;
  const vs = new Set();
  (m[3] || "").split(",").forEach(part => {
    const [a, z] = part.split(/[-–]/).map(x => parseInt(x, 10));
    if (!isNaN(a)) for (let v = a; v <= (isNaN(z) ? a : z); v++) vs.add(v);
  });
  return { b, c, verses: vs };
}
function refFor(b, c, nums) {
  const s = [...nums].sort((x, y) => x - y); const parts = []; let i = 0;
  while (i < s.length) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; parts.push(j > i ? s[i] + "-" + s[j] : String(s[i])); i = j + 1; }
  return `${BOOKS[b]} ${c}:${parts.join(", ")}`;
}

/* ================= SETTINGS ================= */
function localStorage_get(k) { try { return localStorage.getItem("adwj-" + k); } catch { return null; } }
function localStorage_set(k, v) { try { localStorage.setItem("adwj-" + k, v); } catch {} }
function applyTheme() {
  const t = S.settings.theme;
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.documentElement.style.setProperty("--read-size", (S.settings.fontSize || 18) + "px");
}
async function doInstall() { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; render(); }
function openSettings() {
  const layer = $("#layer");
  const close = () => { layer.textContent = ""; render(); };
  const storageLine = h("div", { class: "muted small" }, "Checking storage…");
  const offlineLine = h("div", { class: "muted small" }, "Checking offline status…");
  const restoreMsg = h("div", { class: "small", "aria-live": "polite" });
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Settings" },
    h("div", { class: "spread" }, h("h2", { class: "title", style: "font-size:24px;margin:0" }, "Settings"), h("button", { class: "icon-btn", type: "button", "aria-label": "Close settings", onclick: close }, icon("x"))),

    h("div", { class: "stack", style: "gap:8px" }, h("h3", { class: "sub" }, "Bible reading plan (3 years)"),
      h("label", { class: "lbl" }, "Start date", h("input", { class: "field", type: "date", id: "set-start", value: S.settings.start, onchange: async (e) => { if (!e.target.value) return; S.settings.start = e.target.value; S.viewDay = null; await saveKV("settings"); toast(`You’re on Day ${currentDay()}`); } })),
      h("div", { class: "row" },
        h("button", { class: "btn sm", type: "button", onclick: async () => { S.settings.start = ymd(new Date()); $("#set-start").value = S.settings.start; S.viewDay = null; await saveKV("settings"); toast("Day 1 starts today"); } }, "Start today"),
        h("button", { class: "btn sm", type: "button", onclick: async () => { S.settings.start = new Date().getFullYear() + "-01-01"; $("#set-start").value = S.settings.start; S.viewDay = null; await saveKV("settings"); toast(`You’re on Day ${currentDay()}`); } }, "Start January 1")),
      h("p", { class: "muted small", style: "margin:0" }, "Checked chapters stay with their day number when you move the start date.")),

    h("div", { class: "stack", style: "gap:8px" }, h("h3", { class: "sub" }, "Reading"),
      h("label", { class: "lbl" }, "Bible text size", h("input", { type: "range", id: "set-size", min: "15", max: "26", value: String(S.settings.fontSize || 18), oninput: (e) => { S.settings.fontSize = +e.target.value; applyTheme(); saveKV("settings"); } })),
      h("div", { class: "seg", role: "group", "aria-label": "Theme" }, ...[["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => h("button", { type: "button", "aria-pressed": S.settings.theme === k ? "true" : "false", onclick: (e) => { S.settings.theme = k; applyTheme(); saveKV("settings"); [...e.target.parentNode.children].forEach(b => b.setAttribute("aria-pressed", b === e.target ? "true" : "false")); } }, l)))),

    h("div", { class: "stack", style: "gap:8px" }, h("h3", { class: "sub" }, "Install & offline"),
      isStandalone() ? h("div", { class: "chip ok", style: "justify-self:start" }, "Installed on this device")
        : installEvt ? h("button", { class: "btn primary", type: "button", style: "justify-self:start", onclick: doInstall }, "Install on this device")
        : h("p", { class: "small", style: "margin:0" }, isIOS ? "iPhone or iPad: open this page in Safari, tap the Share button, then Add to Home Screen." : "Android: open the browser menu (⋮) and tap Install app or Add to Home screen."),
      offlineLine, storageLine,
      h("button", { class: "btn sm", type: "button", style: "justify-self:start", onclick: async () => { try { const ok = await navigator.storage.persist(); toast(ok ? "Your data is protected from automatic cleanup" : "Your browser didn’t allow it. Install the app and try again."); } catch { toast("This browser doesn’t support it"); } } }, "Protect my data from cleanup")),

    h("div", { class: "stack", style: "gap:8px" }, h("h3", { class: "sub" }, "Backup"),
      h("p", { class: "muted small", style: "margin:0" }, "Your notes, sermons, prayers, Bible studies, files and progress live only on this device. Download a backup now and then, and use it to move to a new phone."),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", onclick: exportBackup }, "Download backup"),
        h("label", { class: "btn" }, "Restore from backup", h("input", { type: "file", accept: "application/json,.json", style: "display:none", onchange: (e) => importBackup(e.target.files[0], restoreMsg) }))),
      restoreMsg),

    h("div", { class: "stack", style: "gap:6px" }, h("h3", { class: "sub" }, "About"),
      h("p", { class: "muted small", style: "margin:0" }, "Daily devotional: C. H. Spurgeon, Morning and Evening (1866, public domain). Bible text: King James Version (public domain), stored on your device. NIV buttons open BibleGateway and need internet. Memory verses: your Lamp 2 plan (NIV 1984), Witnessing verses and the Navigators’ Topical Memory System (KJV text)."),
      h("p", { class: "muted small", style: "margin:0" }, NIV_NOTICE))
  );
  layer.textContent = "";
  layer.append(h("div", { class: "overlay", onclick: (e) => { if (e.target === e.currentTarget) close(); } }, sheet));
  (async () => {
    try { const est = await navigator.storage.estimate(); const p = navigator.storage.persisted ? await navigator.storage.persisted() : false; storageLine.textContent = `Using ${fmtBytes(est.usage || 0)} of storage${p ? " · protected" : ""}`; } catch { storageLine.textContent = ""; }
    try { const has = "caches" in window && await caches.match("kjv.json"); offlineLine.textContent = has ? "Ready offline: the Bible and app are saved on this device." : "Offline mode turns on after the app is opened from its web address once."; } catch { offlineLine.textContent = ""; }
  })();
}
function blobToDataUrl(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
async function exportBackup() {
  try {
    toast("Preparing backup…");
    const files = await DB.all("files");
    const fileData = [];
    for (const f of files) fileData.push({ id: f.id, name: f.name, type: f.type, size: f.size, data: await blobToDataUrl(f.blob) });
    const data = { app: "a-day-with-jesus", version: 1, exported: new Date().toISOString(), settings: S.settings, progress: S.progress, mem: S.mem, saved: S.saved, notes: S.notes.filter(n => !n.draft), sermons: S.sermons.filter(x => !x.draft), studies: S.studies.filter(x => !x.draft), prayers: S.prayers, files: fileData };
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: `a-day-with-jesus-backup-${ymd(new Date())}.json` });
    document.body.append(a); a.click(); a.remove();
    toast("Backup downloaded");
  } catch { toast("Couldn’t create the backup"); }
}
async function importBackup(file, msg) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "a-day-with-jesus") throw new Error("not ours");
    msg.textContent = "Restoring…";
    for (const f of data.files || []) { const blob = await (await fetch(f.data)).blob(); await DB.put("files", { id: f.id, blob, name: f.name, type: f.type, size: f.size }); }
    for (const n of data.notes || []) await DB.put("notes", n);
    for (const s of data.saved || []) await DB.put("saved", s);
    for (const s of data.sermons || []) await DB.put("sermons", s);
    for (const s of data.studies || []) await DB.put("studies", s);
    for (const s of data.prayers || []) await DB.put("prayers", s);
    S.settings = { ...S.settings, ...(data.settings || {}) }; S.progress = { ...S.progress, ...(data.progress || {}) }; S.mem = { ...S.mem, ...(data.mem || {}) };
    await saveKV("settings"); await saveKV("progress"); await saveKV("mem");
    S.notes = await DB.all("notes"); S.saved = await DB.all("saved"); S.sermons = await DB.all("sermons"); S.studies = await DB.all("studies"); S.prayers = await DB.all("prayers");
    applyTheme();
    msg.textContent = `Restored ${(data.notes || []).length} notes, ${(data.sermons || []).length} sermons, ${(data.saved || []).length} saved verses and ${(data.files || []).length} files.`;
  } catch { msg.textContent = "That file isn’t an A Day With Jesus backup."; }
}

/* ================= START ================= */
async function start() {
  PLAN = buildPlan();
  try {
    const [settings, progress, mem, pos] = await Promise.all(["settings", "progress3y", "mem", "biblePos"].map(k => DB.get("kv", k).catch(() => null)));
    if (settings) S.settings = { ...S.settings, ...settings }; else saveKV("settings");
    if (progress) S.progress = progress;
    if (mem) S.mem = mem;
    if (pos) { S.bible.b = pos.b; S.bible.c = pos.c; }
    S.notes = await DB.all("notes").catch(() => []);
    S.saved = await DB.all("saved").catch(() => []);
    S.sermons = await DB.all("sermons").catch(() => []);
    S.studies = await DB.all("studies").catch(() => []);
    S.prayers = await DB.all("prayers").catch(() => []);
  } catch {}
  applyTheme();
  readHash();
  render();
  if (!(await DB.persistent())) toast("This browser can’t save data, so changes last only until you close the page");
  fetch("memory.json").then(r => r.json()).then(d => { MEMORY = d; if (S.tab === "memory") rerenderKeepScroll(); }).catch(() => {});
  loadBible().then(() => { if (S.tab === "bible") render(); }).catch(() => {});
}
window.addEventListener("hashchange", () => { readHash(); if (S.tab !== "bible") S.bible.sel.clear(); render(); window.scrollTo(0, 0); });
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (S.tab === "today") rerenderKeepScroll(); });
$("#open-settings").addEventListener("click", openSettings);
// Re-check the day when the app comes back to the foreground (e.g. the next morning)
let lastDay = ymd(new Date());
document.addEventListener("visibilitychange", () => { if (!document.hidden && ymd(new Date()) !== lastDay) { lastDay = ymd(new Date()); S.viewDay = null; render(); } });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
start();

</script>
